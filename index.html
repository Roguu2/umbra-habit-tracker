<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07070a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Umbra" />
    <meta name="description" content="Mroczny tracker nawyków w duchu RPG. Planuj dzień, wypalaj pieczęcie, zdobywaj EXP i poziomy. Za darmo, bez konta. · A dark-fantasy habit tracker. Free, no account." />
    <!-- podgląd linku (Messenger, Discord, X…); %SITE_URL% podmienia vite.config.js adresem z Netlify -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Umbra" />
    <meta property="og:title" content="Umbra · Księga Nawyków" />
    <meta property="og:description" content="Zamień nawyki w przygodę. Mroczny tracker nawyków w duchu RPG — za darmo, bez konta. · Turn your habits into a quest." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' fill='%2307070a'/><path d='M12 3v18M12 11 6 4M12 11l6-7' stroke='%23e0223d' stroke-width='2' fill='none' stroke-linecap='round'/></svg>" />
    <title>Umbra · Księga Nawyków</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- wzór formularza dla Netlify Forms (wykrywany przy wdrożeniu); właściwy formularz wysyła aplikacja -->
    <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="kind" />
      <textarea name="message"></textarea>
      <input name="contact" />
      <input name="lang" />
      <input name="device" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
